name: Compilar Vulcanova APK

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Estructurar Proyecto Android
      run: |
        # 1. Renombrar archivo si tiene acento para evitar errores
        if [ -f "Índice.html" ]; then
          mv "Índice.html" index.html
        fi

        # 2. Crear carpetas
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/vulcanova/app

        # 3. Copiar archivo de la app
        cp index.html app/src/main/assets/index.html

        # 4. Crear AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.vulcanova.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="Vulcanova Diagnostics"
                android:supportsRtl="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. Crear MainActivity.java
        cat << 'EOF' > app/src/main/java/com/vulcanova/app/MainActivity.java
        package com.vulcanova.app;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.app.Activity;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView w = new WebView(this);
                w.getSettings().setJavaScriptEnabled(true);
                w.getSettings().setDomStorageEnabled(true);
                w.setWebViewClient(new WebViewClient());
                w.loadUrl("file:///android_asset/index.html");
                setContentView(w);
            }
        }
        EOF

        # 6. Crear app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.vulcanova.app'
            compileSdk 33
            defaultConfig {
                applicationId "com.vulcanova.app"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        # 7. Crear build.gradle raiz
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 8. Crear settings.gradle
        cat << 'EOF' > settings.gradle
        include ':app'
        EOF

    - name: Compilar APK
      run: gradle assembleDebug

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: Vulcanova-Diagnostics-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
