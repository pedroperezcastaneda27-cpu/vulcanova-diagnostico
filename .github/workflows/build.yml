name: Compilar APK Vulcanova

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Entorno Android
      uses: android-actions/setup-android@v3

    - name: Confirmación de Entorno
      run: echo "Servidor listo para ensamblar Vulcanova Diagnostics"


