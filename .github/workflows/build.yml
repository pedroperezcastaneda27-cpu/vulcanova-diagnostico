name: Compilar Vulcanova APK

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Crear y Compilar APK con Cordova
      run: |
        npm install -g cordova
        cordova create vulcanova_app com.vulcanova.app "Vulcanova Diagnostics"
        cd vulcanova_app
        cordova platform add android
        
        # Copiar tu pantalla al proyecto
        if [ -f "../index.html" ]; then
          cp "../index.html" www/index.html
        elif [ -f "../Índice.html" ]; then
          cp "../Índice.html" www/index.html
        fi
        
        cordova build android

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: Vulcanova-Diagnostics-APK
        path: vulcanova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

